name: Prueba de descarga de imagen de X

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_download:
    name: Descargar y sanear imagen de X
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de descarga de imagen
        env:
          PYTHONPATH: .
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          python scripts/test_x_download.py

      - name: Subir artefacto de imagen descargada
        uses: actions/upload-artifact@v4
        with:
          name: x-downloaded-image
          path: downloaded_x_image.jpg
          retention-days: 7

      - name: Publicar Resumen de GitHub Actions
        if: always()
        run: |
          if [ -f "x_download_summary.md" ]; then
            cat x_download_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Error en la descarga: no se generó el resumen" >> $GITHUB_STEP_SUMMARY
          fi
