name: Monitor de salud del sistema (Health Check)

on:
  schedule:
    # Chequeo preventivo semanal todos los domingos a las 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_health:
    name: Diagnóstico integral y autonomía
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias de diagnóstico
        run: |
          pytest -v tests/test_health_check.py

      - name: Ejecutar auditoría de salud del sistema
        env:
          PYTHONPATH: .
        run: |
          python scripts/health_check.py

      - name: Publicar Diagnóstico de Salud
        if: always()
        run: |
          if [ -f "health_summary.md" ]; then
            cat health_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Error en el monitor de salud: no se generó el resumen" >> $GITHUB_STEP_SUMMARY
          fi
