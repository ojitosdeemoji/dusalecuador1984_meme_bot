name: Recopilar métricas de Bluesky

on:
  schedule:
    # Sincronización automática una vez al día a las 05:00 UTC (horario valle)
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: metrics-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Consultar y persistir engagement en Bluesky
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias de métricas y scoring
        run: |
          pytest -v tests/test_metrics.py tests/test_metrics_persistence.py tests/test_scoring.py

      - name: Consultar, calcular scoring y guardar en el estado
        env:
          PYTHONPATH: .
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python scripts/collect_metrics.py

      - name: Guardar estado actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "bot: sincronizar métricas y scoring en state.json [skip ci]" && git push)

      - name: Publicar Resumen de Métricas y Scoring
        if: always()
        run: |
          if [ -f "metrics_summary.md" ]; then
            cat metrics_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Error: no se pudo generar el resumen de métricas" >> $GITHUB_STEP_SUMMARY
          fi
