name: Validar proyecto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar sintaxis, pruebas, fixture, PDF, imágenes y estado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar sintaxis y compilación
        run: |
          python -m compileall src tests scripts

      - name: Ejecutar pruebas unitarias (incluye prevención de duplicados)
        run: |
          pytest -v tests/

      - name: Generar meme con fixture
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_fixture_meme.py

      - name: Comprobar existencia de out.jpg
        run: |
          if [ ! -f "out.jpg" ]; then
            echo "ERROR: out.jpg no fue generado."
            exit 1
          fi
          echo "out.jpg generado correctamente."
          ls -lh out.jpg

      - name: Validar y auditar corpus PDF
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate_pdf.py

      - name: Validar catálogo de imágenes locales
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate_local_images.py

      - name: Auditar integridad de state.json
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_state.py

      - name: Subir artifact de previsualización
        uses: actions/upload-artifact@v4
        with:
          name: fixture-preview
          path: out.jpg
          retention-days: 7

      - name: Construir Resumen de GitHub Actions
        run: |
          echo "## Resultado de la Validación del Proyecto" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Compilación y Tests:** Pruebas unitarias y reglas anti-duplicados aprobadas." >> $GITHUB_STEP_SUMMARY
          echo "- **Insumos:** Corpus PDF e imágenes locales operativas." >> $GITHUB_STEP_SUMMARY
          echo "- **Persistencia:** \`data/state.json\` auditado sin inconsistencias." >> $GITHUB_STEP_SUMMARY
