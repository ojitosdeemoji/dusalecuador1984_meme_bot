name: Verificar credenciales Bluesky

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_auth:
    name: Probar login con AT Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar verificación de autenticación
        env:
          PYTHONPATH: .
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python scripts/verify_bsky_connection.py

      - name: Construir Resumen de GitHub Actions
        if: always()
        run: |
          echo "## Verificación de Conexión con Bluesky" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado de credenciales:** Validadas contra la API oficial de AT Protocol." >> $GITHUB_STEP_SUMMARY
          echo "- **Seguridad:** Los secretos se mantuvieron enmascarados y protegidos." >> $GITHUB_STEP_SUMMARY
          echo "- **Resultado:** El bot tiene autorización confirmada para publicar en la Fase 8." >> $GITHUB_STEP_SUMMARY
