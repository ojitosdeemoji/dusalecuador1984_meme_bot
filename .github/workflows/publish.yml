name: Publicar o simular meme

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo simulación (Dry Run): genera artefacto y resumen sin publicar ni alterar estado'
        type: boolean
        default: true
        required: true

concurrency:
  group: bot-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run_pipeline:
    name: Ejecución del bot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor del bot
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_bot.py --dry-run
          else
            python scripts/run_bot.py
          fi

      - name: Subir artefacto de previsualización de meme
        uses: actions/upload-artifact@v4
        with:
          name: meme-real-preview
          path: output_meme.jpg
          retention-days: 7

      - name: Publicar Resumen de Ejecución
        if: always()
        run: |
          if [ -f "summary.md" ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Error en la ejecución: no se generó el resumen" >> $GITHUB_STEP_SUMMARY
          fi
