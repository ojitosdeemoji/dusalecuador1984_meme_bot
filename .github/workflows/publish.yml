name: Publicar o simular meme

on:
  schedule:
    # 3 ejecuciones al día: 11:20 UTC, 17:20 UTC y 23:20 UTC
    - cron: '20 11,17,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo simulación (Dry Run): genera artefacto sin publicar ni alterar estado'
        type: boolean
        default: true
        required: true

concurrency:
  group: bot-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run_pipeline:
    name: Ejecución del bot
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retardo editorial aleatorio (Jitter)
        if: github.event_name == 'schedule'
        run: |
          # Retardo entre 0 y 900 segundos (0 a 15 minutos) solo para ejecuciones programadas
          DELAY=$((RANDOM % 900))
          echo "Disparador programado detectado (schedule)."
          echo "Aplicando retardo editorial de $DELAY segundos para distribución orgánica..."
          sleep $DELAY

      - name: Ejecutar motor del bot
        env:
          PYTHONPATH: .
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "Ejecutando en MODO PRODUCCIÓN (publicación activa)..."
            python scripts/run_bot.py
          else
            echo "Ejecutando en MODO SIMULACIÓN (dry-run)..."
            python scripts/run_bot.py --dry-run
          fi

      - name: Guardar estado actualizado en el repositorio
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "bot: registrar publicación programada en state.json [skip ci]" && git push)

      - name: Subir artefacto de previsualización de meme
        uses: actions/upload-artifact@v4
        with:
          name: meme-real-preview
          path: output_meme.jpg
          retention-days: 7

      - name: Publicar Resumen de Ejecución
        if: always()
        run: |
          if [ -f "summary.md" ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Error en la ejecución: no se generó el resumen" >> $GITHUB_STEP_SUMMARY
          fi
